name: Bug report
description: Report a reproducible problem in TLS Fetch MCP
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove credentials, cookies, and private response data before submitting.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0, commit SHA, or dev
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Codex CLI, Codex desktop app, IDE extension, or another client
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and sanitized tool arguments.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove secrets, cookies, authorization headers, proxy credentials, and private content.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am authorized to access the target used in this report.
          required: true
        - label: I removed secrets and private data.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
